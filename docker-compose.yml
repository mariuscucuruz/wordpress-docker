services:
  frontend:
    container_name: ${APP_PREFIX}_wp
    image: wordpress:7.1-php8.5-fpm
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/wp.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
        - WEBUSER=${WEBUSER:-www-data}
        - WEBGROUP=${WEBGROUP:-www-data}
    links:
      - database
    depends_on:
      - database
    networks:
      - public
      - internal
    volumes:
      - wp-data:/var/www/html
      - ./wp/.htaccess:/var/www/html/.htaccess:delegated
      - ./wp/favicon.ico:/var/www/html/favicon.ico:cached
      - ./wp/humans.txt:/var/www/html/humans.txt:cached
      - ./wp/llms.txt:/var/www/html/llms.txt:cached
      - ./wp/robots.txt:/var/www/html/robots.txt:cached
      - ./wp/plugins:/var/www/html/wp-content/plugins:rw
      - ./wp/themes:/var/www/html/wp-content/themes:cached
      - ./wp/uploads:/var/www/html/wp-content/uploads:delegated
      - ./wp/upgrade:/var/www/html/wp-content/upgrade:rw
      - ./wp/upgrade-temp-backup:/var/www/html/wp-content/upgrade-temp-backup:rw
      # # Wordfence WAF
      # - ./wp/wordfence-waf.php:/var/www/html/wordfence-waf.php:rw
      # - ./wp/wflogs:/var/www/html/wp-content/wflogs:rw
      # # Wordfence caching
      # - ./wp/advanced-cache.php:/var/www/html/wp-content/advanced-cache.php:rw
      # - ./wp/wp-cache-config.php:/var/www/html/wp-content/wp-cache-config.php:rw
      - ./docker/php/:/usr/local/etc/php/conf.d/:ro
    environment:
      - WORDPRESS_DOMAIN="https://${APP_HOST:-website.uk}:${APP_PORT:-8082}/"
      - WORDPRESS_DB_HOST=${DB_HOST:-database}
      - WORDPRESS_DB_PORT=${DB_PORT:-3306}
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_DB_USER=${DB_USERNAME:-wpdbuser}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD:-wpdbpassword}
      - WORDPRESS_DEBUG=${WORDPRESS_DEBUG:-true}
      - WP_DEBUG_LOG={WORDPRESS_DEBUG:-true}
      - WP_DEBUG=${WORDPRESS_DEBUG:-true}
      - WP_DEBUG_DISPLAY=${WORDPRESS_DEBUG:-true}
      - WORDPRESS_TABLE_PREFIX=${DB_TABLE_PREFIX:-wp_}
      - WORDPRESS_ENABLE_REVERSE_PROXY=1
      - WORDPRESS_ENABLE_XML_RPC=0
      - WP_CACHE=true
      - WORDPRESS_USERNAME=${APP_USER_ADMIN}
      - WORDPRESS_PASSWORD=${APP_USER_PASS}
      - WORDPRESS_EMAIL=${APP_USER_EMAIL}
      - WORDPRESS_FIRST_NAME=${APP_PREFIX}
      - WORDPRESS_LAST_NAME=${APP_USER_ADMIN}
      - |
        WORDPRESS_CONFIG_EXTRA=
        define('WP_ALLOW_REPAIR', 'repair');
        define('FS_METHOD', 'direct');
        define('WP_HOME', 'https://${APP_HOST:-website.uk}:${APP_PORT:-8082}/');
        define('WP_SITEURL', 'https://${APP_HOST:-website.uk}:${APP_PORT:-8082}/');
        define('WORDPRESS_ENABLE_REVERSE_PROXY', true);
        define('WORDPRESS_ENABLE_XML_RPC', false);
        define('WPLANG', 'en_GB');
        date_default_timezone_set('Europe/London');
        # define('DOMAIN_CURRENT_SITE', '${APP_HOST:-website.uk}:${APP_PORT:-8082}');
        # define('SITE_ID_CURRENT_SITE', 1);
        # define('BLOG_ID_CURRENT_SITE', 1);
        # define('WP_ALLOW_MULTISITE', ('${APP_MULTISITE}'=='1') ? true : false );
        # define('MULTISITE', ('${APP_MULTISITE}'=='1') ? true : false);
        # define('WORDPRESS_ENABLE_MULTISITE', ('${APP_MULTISITE}'=='1') ? true : false);
        # define('SUBDOMAIN_INSTALL', ('${APP_MULTISITE}'=='1') ? true : false);
        # define('PATH_CURRENT_SITE', '/');
      - TZ=Europe/London

  database:
    container_name: ${APP_PREFIX}_db
    image: mariadb:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/db.dockerfile
    networks:
      - internal
    command: [ "mysqld", "--explicit_defaults_for_timestamp" ]
    volumes:
      - ./docker/mysql:/etc/mysql/conf.d:ro
      - ./docker/db:/docker-entrypoint-initdb.d/
      # - ./docker/db/backup-2025.sql:/var/backups/
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-wordpress}
      - MYSQL_USER=${DB_USERNAME:-wpdbuser}
      - MYSQL_PASSWORD=${DB_PASSWORD:-wpdbpassword}
      - TZ=Europe/London

  proxy:
    container_name: ${APP_PREFIX}_proxy
    image: nginx:latest
    restart: on-failure
    tty: true
    ports:
      - ${APP_PORT:-8083}:443
    networks:
      - public
    volumes_from:
      - frontend
    volumes:
      - ./nginx:/etc/nginx/conf.d/:ro
      - ./ssl:/etc/letsencrypt/live/${APP_HOST:-website.uk}:rw
    environment:
      - NGINX_HOST=${APP_HOST:-website.uk}
      - NGINX_PORT=443
      - TZ=Europe/London

volumes:
  wp-data:
  db-data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
